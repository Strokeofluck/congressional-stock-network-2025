<style>
.v1-controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0}
.v1-controls label{font-weight:500;display:flex;align-items:center;gap:6px}
.v1-controls input{border:1px solid #bfc7ce;padding:8px;border-radius:5px;max-width:180px}
.v1-graph{height:620px;border:1px solid #d8dee5;background:white;border-radius:8px;overflow:hidden}
#v1Selection{max-height:200px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:12px}
#v1Page .code-wrap{max-width:1200px}
.book-reference{font-size:.94rem;color:#526173;border-left:3px solid #a4b7cb;padding:8px 14px;margin:12px 0}
#memberOverlapView #v1MembersGraph{height:100%;min-height:0;border:0;border-radius:0;margin:0}
#mainOverlapOptions{display:none}
body.member-overlap-mode .affiliation-legend-item{display:none!important}
body.member-overlap-mode #mainOverlapOptions{display:block}
#mainOverlapOptions label{display:block;font-weight:700;margin:10px 0 5px}
#mainOverlapThreshold{width:80px;padding:5px 8px;border:1px solid #ccd2d8;border-radius:7px;background:white}
#mainOverlapLayout{width:100%;padding:6px;border:1px solid #ccd2d8;border-radius:7px;background:white;font-size:11px}
#v1MembersGraph{position:relative}
.member-party-heading{position:absolute;top:12px;transform:translateX(-50%);pointer-events:none;z-index:2;padding:4px 9px;background:rgba(255,255,255,.94);border-radius:5px;font-size:13px;font-weight:700;white-space:nowrap}
#memberOverlapView .member-party-heading{top:82px}
@media(min-width:761px){body.embed-mode .member-party-heading{margin-top:35px}}
#mainOverlapOptions p{font-size:11px;line-height:1.5;margin:10px 0}
#mainOverlapOptions .nav-button{font-size:11px;padding:6px 9px}
#mainOverlapSelection{white-space:pre-wrap;overflow-wrap:anywhere;max-height:220px;overflow:auto;font-size:11px;line-height:1.5;margin-top:10px}
body.explore-page-active .graph-legend{flex-wrap:nowrap;overflow-x:hidden}
body.explore-page-active .graph-legend> *{flex-shrink:0;max-width:100%}
body.explore-page-active.member-overlap-mode .graph-legend{max-width:280px;max-height:calc(100dvh - 240px);overflow-y:auto}
#mainOverlapOptions{width:100%}
@media(min-width:761px){.graph-layer-panel{max-width:calc(100vw - 285px);flex-wrap:wrap}body.explore-page-active.member-overlap-mode .graph-legend{max-height:calc(100dvh - 340px)}}
@media(max-width:760px){.topbar .nav-actions{flex-wrap:wrap!important;overflow:visible!important;border-radius:14px!important}body:not(.explore-page-active) .topbar .nav-actions{max-width:calc(100vw - 16px)!important}.topbar .nav-actions .nav-button{font-size:10px!important;padding:6px 9px!important}#v1Page{padding-bottom:90px}}
@media(max-width:600px){.v1-graph{height:480px}.v1-controls{gap:8px}.v1-controls .nav-button{padding:8px 10px}#v1Page .code-wrap{padding:18px 12px}}
</style>
<style>.method-table-wrap{overflow-x:auto;margin:14px 0}.method-table{width:100%;border-collapse:collapse}.method-table th,.method-table td{padding:10px;text-align:left;vertical-align:top;border-bottom:1px solid #d8dee5}.method-table td{min-width:130px}.v1-directory-member{white-space:normal;text-align:left}
@media(max-width:600px){#codePage .method-table thead{display:none}#codePage .method-table,#codePage .method-table tbody,#codePage .method-table tr,#codePage .method-table td{display:block;width:auto;min-width:0}#codePage .method-table tr{padding:12px 0;border-bottom:1px solid #d8dee5}#codePage .method-table td{border:0;padding:5px 0}#codePage .method-table td:first-child{font-weight:700}}
</style>
<script>
(function(){
  function init(){
    const page=document.getElementById('v1Page');
    if(!page)return;
    let mode='members';
    const byId=id=>document.getElementById(id);
    let inMain=false;
    const memberGraph=byId('v1MembersGraph'), mainHost=byId('memberOverlapView');
    const layoutControls=[byId('mainOverlapLayout'),byId('v1MemberLayout')];
    let memberLayout=byId('mainOverlapLayout').value;
    let partyPositions=null, partyHeadings=[];
    const boundNetworks=new WeakSet();
    const preparingNetworks=new WeakSet();
    const memberHome=document.createElement('div');
    memberHome.id='v1MembersHome';memberGraph.before(memberHome);
    function setSelection(text){byId('v1Selection').textContent=text;byId('mainOverlapSelection').textContent=text;}
    document.querySelectorAll('.v1-directory-member').forEach(button=>{
      button.addEventListener('click',()=>{selectMode('members');byId('v1Search').value=button.dataset.member;setTimeout(find,250);});
    });
    const directoryFilter=byId('v1DirectoryFilter');
    if(directoryFilter)directoryFilter.oninput=function(){
      const q=this.value.toLowerCase().trim();
      document.querySelectorAll('.v1-directory-row').forEach(row=>{row.hidden=!row.textContent.toLowerCase().includes(q);});
    };
    const network=()=>window.v1Networks&&window.v1Networks[mode];
    function fitMemberNetwork(n){
      if(memberLayout!=='party'){n.fit({animation:false});return;}
      const width=n.body.container.clientWidth,height=n.body.container.clientHeight;
      const positions=Object.values(partyPositions||{});if(!positions.length||!width||!height)return;
      const minX=Math.min(...positions.map(p=>p.x))-150,maxX=Math.max(...positions.map(p=>p.x))+150;
      const minY=Math.min(...positions.map(p=>p.y))-70,maxY=Math.max(...positions.map(p=>p.y))+90;
      const desktop=inMain&&width>760;
      const left=desktop?330:20,right=25,top=inMain?155:55,bottom=inMain?145:30;
      const scale=Math.max(.08,Math.min((width-left-right)/(maxX-minX),(height-top-bottom)/(maxY-minY)));
      n.moveTo({position:{x:(minX+maxX)/2,y:(minY+maxY)/2},scale,offset:{x:(left-right)/2,y:(top-bottom)/2},animation:false});
    }
    function fit(){window.dispatchEvent(new Event('resize'));setTimeout(()=>{const n=network();if(n){const box=n.body.container.closest('.network-view')||n.body.container.parentElement;if(box.clientWidth&&box.clientHeight)n.setSize(box.clientWidth+'px',box.clientHeight+'px');n.redraw();if(mode==='members')fitMemberNetwork(n);else n.fit({animation:false});}},180);}
    window.fitMemberOverlap=function(){const n=window.v1Networks&&window.v1Networks.members;if(!n)return;const box=n.body.container.closest('.network-view')||n.body.container.parentElement;if(box.clientWidth&&box.clientHeight)n.setSize(box.clientWidth+'px',box.clientHeight+'px');n.redraw();fitMemberNetwork(n);};
    function buildPartyLayout(n){
      const groups=new Map();
      n.body.data.nodes.get().forEach(node=>{const party=node.party||node.group||'Unknown';if(!groups.has(party))groups.set(party,[]);groups.get(party).push(node);});
      const ordered=['Democrat','Republican',...Array.from(groups.keys()).filter(p=>!['Democrat','Republican'].includes(p)).sort()].filter(p=>groups.has(p));
      const plans=ordered.map(party=>{
        const nodes=groups.get(party).sort((a,b)=>a.label.localeCompare(b.label));
        const columns=Math.max(1,Math.ceil(Math.sqrt(nodes.length/2)));
        return {party,nodes,columns,width:(columns-1)*270,rows:Math.ceil(nodes.length/columns)};
      });
      const totalWidth=plans.reduce((sum,p)=>sum+p.width,0)+360*(plans.length-1);
      let left=-totalWidth/2;partyPositions={};
      partyHeadings.forEach(h=>h.element.remove());partyHeadings=[];
      plans.forEach(plan=>{
        const center=left+plan.width/2;
        plan.nodes.forEach((node,i)=>{
          const row=Math.floor(i/plan.columns),column=i%plan.columns;
          const rowCount=Math.min(plan.columns,plan.nodes.length-row*plan.columns);
          partyPositions[node.id]={x:center+(column-(rowCount-1)/2)*270,y:(row-(plan.rows-1)/2)*130};
        });
        const element=document.createElement('div');element.className='member-party-heading';
        element.textContent=(plan.party==='Democrat'?'Democrats':plan.party==='Republican'?'Republicans':plan.party)+' ('+plan.nodes.length+')';
        memberGraph.appendChild(element);partyHeadings.push({element,x:center});left+=plan.width+360;
      });
    }
    function positionPartyHeadings(n){
      partyHeadings.forEach(h=>{
        h.element.hidden=memberLayout!=='party';
        h.element.style.top=inMain?'160px':'12px';
        if(memberLayout==='party'){
          const x=n.canvasToDOM({x:h.x,y:0}).x;
          h.element.style.left=Math.max(85,Math.min(memberGraph.clientWidth-85,x))+'px';
        }
      });
    }
    function applyMemberLayout(){
      memberLayout=byId('mainOverlapLayout').value==='network'?'network':'party';
      layoutControls.forEach(control=>control.value=memberLayout);
      const note=memberLayout==='party'
        ?'Democrats left; Republicans right. Members are alphabetical within each party. Positions are assigned by party, not detected communities or similarity.'
        :'Force-directed layout: positions follow the network structure; screen distance is not a numerical similarity measure.';
      [byId('mainOverlapLayoutNote'),byId('v1LayoutNote')].forEach(el=>el.textContent=note);
      const n=window.v1Networks&&window.v1Networks.members;
      if(!n)return;
      if(!boundNetworks.has(n)){boundNetworks.add(n);n.on('afterDrawing',()=>positionPartyHeadings(n));}
      const initial=window.networkInitialPositions&&window.networkInitialPositions.members;
      if(!initial){
        if(!preparingNetworks.has(n)){
          preparingNetworks.add(n);
          // Deferred widgets can finish constructor stabilization before their R event handlers attach.
          n.once('stabilizationIterationsDone',()=>{
            window.networkInitialPositions=window.networkInitialPositions||{};
            window.networkInitialPositions.members=window.networkInitialPositions.members||n.getPositions();
            n.setOptions({physics:false});applyMemberLayout();fit();
          });
          setTimeout(()=>n.stabilize(150),0);
        }
        return;
      }
      if(!partyPositions)buildPartyLayout(n);
      n.setOptions({physics:false});
      const positions=memberLayout==='party'?partyPositions:initial;
      Object.entries(positions).forEach(([id,p])=>n.moveNode(id,p.x,p.y));
      n.body.data.nodes.update(n.body.data.nodes.get().map(node=>{
        const words=String(node.id).split(' '),lines=[];let line='';
        words.forEach(word=>{if(line&&(line+' '+word).length>20){lines.push(line);line=word;}else line+=(line?' ':'')+word;});
        if(line)lines.push(line);
        return {id:node.id,label:memberLayout==='party'?lines.join('\n'):node.id,font:{size:memberLayout==='party'?24:12,strokeWidth:3,strokeColor:'#ffffff'}};
      }));
      positionPartyHeadings(n);n.redraw();
    }
    layoutControls.forEach(control=>control.onchange=function(){byId('mainOverlapLayout').value=this.value;applyMemberLayout();fit();if(inMain&&window.updateNetworkShareUrl)window.updateNetworkShareUrl();});
    window.onV1MemberStabilized=function(){applyMemberLayout();fit();};
    window.mountMemberOverlap=function(){
      inMain=true;mode='members';mainHost.appendChild(memberGraph);memberGraph.style.display='block';
      document.body.classList.add('member-overlap-mode');applyThreshold(byId('mainOverlapThreshold').value);applyMemberLayout();fit();
    };
    window.unmountMemberOverlap=function(){
      inMain=false;memberHome.after(memberGraph);document.body.classList.remove('member-overlap-mode');
    };
    function open(){
      window.unmountMemberOverlap();
      ['explorePage','aboutPage','codePage'].forEach(id=>byId(id).style.display='none');
      ['navExplore','navAbout','navCode'].forEach(id=>byId(id).classList.remove('active'));
      page.style.display='block';
      document.body.classList.remove('explore-page-active','explore-locked');
      selectMode(mode);
      window.scrollTo(0,0);fit();
    }
    ['navExplore','navAbout','navCode','backToNetwork','backToNetworkFromCode'].forEach(id=>{
      const el=byId(id);if(el)el.addEventListener('click',()=>{page.style.display='none';if(id==='navExplore'&&mainHost.classList.contains('active'))window.mountMemberOverlap();});
    });
    function selectMode(next){
      mode=next;
      byId('v1MembersGraph').style.display=mode==='members'?'block':'none';
      byId('v1AllGraph').style.display=mode==='all'?'block':'none';
      byId('v1MembersBtn').classList.toggle('active',mode==='members');
      byId('v1AllBtn').classList.toggle('active',mode==='all');
      byId('v1ThresholdLabel').style.display=mode==='members'?'flex':'none';
      byId('v1LayoutLabel').style.display=mode==='members'?'flex':'none';
      byId('v1LayoutNote').style.display=mode==='members'?'block':'none';
      if(mode==='members')applyMemberLayout();
      byId('v1GraphNote').textContent=mode==='members'
        ?'Member overlap: thicker lines mean more distinct shared tickers. Node size counts all distinct accepted stocks. Red = Republican; blue = Democrat. Click a line for its tickers or a member for their accepted stocks. The threshold changes the display only; statistics below always use the complete projection.'
        :'All accepted affiliations: circles are members; gold diamonds are stocks. Each equal-width line means at least one reported purchase. This includes stocks reported by just one member. Click a member or stock to inspect its connections.';
      setSelection('Select a member or connection to inspect it.');fit();
    }
    byId('v1MembersBtn').onclick=()=>selectMode('members');
    byId('v1AllBtn').onclick=()=>selectMode('all');
    byId('v1FitBtn').onclick=fit;
    function applyThreshold(value){
      const minimum=Math.min(Number(byId('mainOverlapThreshold').max),Math.max(1,Math.floor(Number(value)||1)));
      byId('v1Threshold').value=minimum;byId('mainOverlapThreshold').value=minimum;
      const n=window.v1Networks&&window.v1Networks.members;if(!n)return;
      const edges=n.body.data.edges.get();
      n.body.data.edges.update(edges.map(e=>({id:e.id,hidden:e.shared_stocks<minimum})));
      setSelection(edges.filter(e=>e.shared_stocks>=minimum).length+' visible member pairs at ≥ '+minimum+' shared stocks. All 55 members are retained; analytical statistics are unchanged.');
    }
    [byId('v1Threshold'),byId('mainOverlapThreshold')].forEach(input=>input.oninput=function(){applyThreshold(this.value);if(inMain&&window.updateNetworkShareUrl)window.updateNetworkShareUrl();});
    window.resetMemberOverlap=function(){applyThreshold(1);applyMemberLayout();const n=window.v1Networks&&window.v1Networks.members;if(n)n.unselectAll();fit();setSelection('Select a member or line to inspect it.');if(window.updateNetworkShareUrl)window.updateNetworkShareUrl();};
    window.onV1NetworkReady=function(key){if(key==='members'){applyThreshold(inMain?byId('mainOverlapThreshold').value:byId('v1Threshold').value);applyMemberLayout();}if(key===mode)fit();};
    byId('mainOverlapDetails').onclick=open;
    function find(){
      const n=network(), q=byId('v1Search').value.toLowerCase().trim();if(!n||!q)return;
      const matches=n.body.data.nodes.get().filter(x=>(x.label||'').replace(/\n/g,' ').toLowerCase().includes(q));
      if(!matches.length){byId('v1Selection').textContent='No matching node in this view.';return;}
      const id=matches[0].id;n.selectNodes([id]);n.focus(id,{scale:1.3,animation:true});
      window.v1Inspect(mode,{nodes:[id],edges:[]},n);
    }
    byId('v1FindBtn').onclick=find;
    byId('v1Search').onkeydown=e=>{if(e.key==='Enter')find();};
    window.v1Inspect=function(key,p,n){
      const out=byId('v1Selection');
      if(p.nodes&&p.nodes.length){
        const id=p.nodes[0], node=n.body.data.nodes.get(id);
        const name=key==='members'?id:String(id).replace(/^M:/,'');
        const stocks=(window.v1StockSets||{})[name];
        setSelection(stocks?name+' — '+stocks.length+' distinct accepted '+(stocks.length===1?'stock':'stocks')+':\n'+stocks.join(', ')
          :node.label+' — connected members:\n'+n.getConnectedNodes(id).map(x=>n.body.data.nodes.get(x).label).sort().join(', '));
      }else if(key==='members'&&p.edges&&p.edges.length){
        const e=n.body.data.edges.get(p.edges[0]);
        setSelection(e.from+' + '+e.to+'\n'+e.shared_stocks+' shared tickers: '+e.tickers+'\nFull stock lists: '+e.from_degree+' and '+e.to_degree+'; Jaccard overlap: '+(100*e.jaccard).toFixed(1)+'%.\nShared annual purchases do not establish coordination or simultaneous ownership.');
      }
    };
    if(mainHost.classList.contains('active'))window.mountMemberOverlap();
    applyMemberLayout();
    if(new URLSearchParams(location.search).get('analysis')==='1')setTimeout(open,500);
    if(new URLSearchParams(location.search).get('methods')==='1')setTimeout(()=>byId('navCode').click(),500);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
