name: Verify self-contained 2025 analysis
on:
  pull_request:
  push:
    branches: [review/methodology-audit-2026-10]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rmarkdown
            any::knitr
            any::dplyr
            any::readr
            any::stringr
            any::visNetwork
            any::htmltools
            any::jsonlite
            any::yaml
            any::tibble
      - name: Verify bundled inputs and reproduce accepted extract
        run: |
          python3 scripts/verify_2025_inputs.py
          python3 scripts/prepare_2025.py
          python3 scripts/verify_2025_inputs.py
      - name: Rebuild without another source checkout
        run: Rscript render.R
      - name: Independently verify network calculations
        run: python3 verify_v1.py
