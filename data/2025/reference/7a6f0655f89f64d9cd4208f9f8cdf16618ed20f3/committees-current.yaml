  jurisdiction: The House Committee on the Budget is responsible for drafting a concurrent
    resolution on the budget for congressional action on spending, revenue, and debt-limit
    legislation. The Budget Resolution must be jointly agreed to by both the House
    and the Senate, but does not need to be signed by the President. The Committee
    is also responsible for enforcing the Budget Resolution by informing representatives
    of violations to the budget, and by working with other committees, such as the
    Committee on Appropriations, to prevent potential violations.
